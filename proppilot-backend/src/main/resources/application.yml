spring:
  datasource:
    # DATABASE_URL (JDBC form) wins; else Railway's PG* vars; else local dev.
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:proppilot}}
    username: ${DATABASE_USERNAME:${PGUSER:proppilot}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:proppilot123}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /api-docs

google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}
